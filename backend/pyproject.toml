[project]
name = "dioner-backend"
version = "0.1.0"
description = "DIONER Keyboardist backend: video tutorial search (YouTube Data API proxy)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
